<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ETS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }

        body {
            background-color: #ecf0f1;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .sidebar {
            background: var(--primary-color);
            min-height: 100vh;
        }

        .sidebar a {
            color: #ecf0f1;
            padding: 0.75rem 1.5rem;
            display: block;
        }

        .sidebar a:hover {
            background-color: var(--secondary-color);
        }

        .main-content {
            padding: 2rem;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .profile-info {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-info p {
            margin-bottom: 1rem;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 0.75rem;
        }

        .profile-info strong {
            color: var(--primary-color);
        }

        .info-label {
            font-weight: 600;
            color: #2c3e50;
            min-width: 150px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-users"></i> ETS Employee</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li><a href="/employee/dashboard"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/employee/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li><a href="/employee/leaves"><i class="fas fa-calendar-alt"></i> My Leaves</a></li>
                    <li><a href="/employee/profile"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-10 main-content">
                <div class="card" th:if="${employee}">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-circle"></i> My Profile</h5>
                    </div>
                    <div class="card-body">
                        <div class="profile-info">
                            <p><span class="info-label"><i class="fas fa-id-card"></i> Employee ID:</span> <span th:text="${employee.employeeId}"></span></p>
                            <p><span class="info-label"><i class="fas fa-user"></i> Name:</span> <span th:text="${employee.firstName + ' ' + employee.lastName}"></span></p>
                            <p><span class="info-label"><i class="fas fa-envelope"></i> Email:</span> <span th:text="${employee.email}"></span></p>
                            <p><span class="info-label"><i class="fas fa-phone"></i> Phone:</span> <span th:text="${employee.phoneNumber}"></span></p>
                            <p><span class="info-label"><i class="fas fa-briefcase"></i> Position:</span> <span th:text="${employee.position}"></span></p>
                            <p><span class="info-label"><i class="fas fa-building"></i> Department:</span> <span th:text="${employee.departmentName}"></span></p>
                            <p><span class="info-label"><i class="fas fa-calendar"></i> Date of Joining:</span> <span th:text="${employee.dateOfJoining}"></span></p>
                            <p><span class="info-label"><i class="fas fa-dollar-sign"></i> Salary:</span> <span th:text="${'$' + employee.salary}"></span></p>
                            <p><span class="info-label"><i class="fas fa-map-marker"></i> Address:</span> <span th:text="${employee.address}"></span></p>
                            <p><span class="info-label"><i class="fas fa-city"></i> City:</span> <span th:text="${employee.city}"></span></p>
                            <p><span class="info-label"><i class="fas fa-map"></i> State:</span> <span th:text="${employee.state}"></span></p>
                            <p style="border-bottom: none;"><span class="info-label"><i class="fas fa-mail-bulk"></i> Zip Code:</span> <span th:text="${employee.zipCode}"></span></p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
