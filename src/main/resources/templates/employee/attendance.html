<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - ETS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }

        body {
            background-color: #ecf0f1;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .sidebar {
            background: var(--primary-color);
            min-height: 100vh;
        }

        .sidebar a {
            color: #ecf0f1;
            padding: 0.75rem 1.5rem;
            display: block;
        }

        .sidebar a:hover {
            background-color: var(--secondary-color);
        }

        .main-content {
            padding: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary-color);
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .table {
            background: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-users"></i> ETS Employee</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li><a href="/employee/dashboard"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/employee/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li><a href="/employee/leaves"><i class="fas fa-calendar-alt"></i> My Leaves</a></li>
                    <li><a href="/employee/profile"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-10 main-content">
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number" th:text="${totalPresent}">0</div>
                            <p class="text-success"><i class="fas fa-check-circle"></i> Present</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number" th:text="${totalAbsent}">0</div>
                            <p class="text-danger"><i class="fas fa-times-circle"></i> Absent</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number" th:text="${totalLate}">0</div>
                            <p class="text-warning"><i class="fas fa-clock"></i> Late</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <form action="/employee/attendance/check-in" method="POST">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-sign-in-alt"></i> Check In
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-calendar-check"></i> Attendance Records</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${attendanceList.isEmpty()}" class="alert alert-info">
                            No attendance records yet
                        </div>
                        <div th:if="${not attendanceList.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Check In</th>
                                        <th>Check Out</th>
                                        <th>Status</th>
                                        <th>Remarks</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="att : ${attendanceList}">
                                        <td th:text="${att.attendanceDate}"></td>
                                        <td th:text="${att.checkInTime}"></td>
                                        <td th:text="${att.checkOutTime}"></td>
                                        <td>
                                            <span th:if="${att.status == 'PRESENT'}" class="badge bg-success">Present</span>
                                            <span th:if="${att.status == 'ABSENT'}" class="badge bg-danger">Absent</span>
                                            <span th:if="${att.status == 'LATE'}" class="badge bg-warning">Late</span>
                                        </td>
                                        <td th:text="${att.remarks}"></td>
                                        <td>
                                            <form th:if="${att.checkOutTime == null}" th:action="@{/employee/attendance/check-out/{id}(id=${att.id})}" method="POST" style="display:inline;">
                                                <button type="submit" class="btn btn-sm btn-warning">
                                                    <i class="fas fa-sign-out-alt"></i> Check Out
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
