<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leaves - ETS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }

        body {
            background-color: #ecf0f1;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .sidebar {
            background: var(--primary-color);
            min-height: 100vh;
        }

        .sidebar a {
            color: #ecf0f1;
            padding: 0.75rem 1.5rem;
            display: block;
        }

        .sidebar a:hover {
            background-color: var(--secondary-color);
        }

        .main-content {
            padding: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .table {
            background: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-users"></i> ETS Employee</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li><a href="/employee/dashboard"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/employee/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li><a href="/employee/leaves"><i class="fas fa-calendar-alt"></i> My Leaves</a></li>
                    <li><a href="/employee/profile"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-10 main-content">
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number text-success" th:text="${approved}">0</div>
                            <p><i class="fas fa-check-circle"></i> Approved</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number text-warning" th:text="${pending}">0</div>
                            <p><i class="fas fa-clock"></i> Pending</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="number text-danger" th:text="${rejected}">0</div>
                            <p><i class="fas fa-times-circle"></i> Rejected</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <a href="/employee/leaves/apply" class="btn btn-primary w-100">
                            <i class="fas fa-plus"></i> Apply Leave
                        </a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-calendar-alt"></i> Leave Records</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${leaves.isEmpty()}" class="alert alert-info">
                            No leave records yet
                        </div>
                        <div th:if="${not leaves.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Type</th>
                                        <th>Start Date</th>
                                        <th>End Date</th>
                                        <th>Reason</th>
                                        <th>Status</th>
                                        <th>Approved By</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="leave : ${leaves}">
                                        <td th:text="${leave.leaveType}"></td>
                                        <td th:text="${leave.startDate}"></td>
                                        <td th:text="${leave.endDate}"></td>
                                        <td th:text="${leave.reason}"></td>
                                        <td>
                                            <span th:if="${leave.status == 'APPROVED'}" class="badge bg-success">Approved</span>
                                            <span th:if="${leave.status == 'PENDING'}" class="badge bg-warning">Pending</span>
                                            <span th:if="${leave.status == 'REJECTED'}" class="badge bg-danger">Rejected</span>
                                        </td>
                                        <td th:text="${leave.approvedBy}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
