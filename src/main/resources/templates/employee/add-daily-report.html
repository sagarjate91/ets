<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report - ETS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }
        body { background-color: #ecf0f1; }
        .navbar { background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); }
        .sidebar { background: var(--primary-color); min-height: 100vh; }
        .sidebar a { color: #ecf0f1; padding: 0.75rem 1.5rem; display: block; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--secondary-color); }
        .main-content { padding: 2rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }
        textarea { resize: vertical; min-height: 100px; }
        .section-label {
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-users"></i> ETS Employee</a>
            <div class="ms-auto">
                <a href="/logout" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <ul class="nav flex-column pt-3">
                    <li><a href="/employee/dashboard"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/employee/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li><a href="/employee/leaves"><i class="fas fa-calendar-alt"></i> My Leaves</a></li>
                    <li><a href="/employee/daily-reports" class="active"><i class="fas fa-book-open"></i> Daily Diary</a></li>
                    <li><a href="/employee/profile"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>

            <main class="col-md-10 main-content">
                <div class="d-flex align-items-center mb-4">
                    <a href="/employee/daily-reports" class="btn btn-outline-secondary btn-sm me-3">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                    <h4 class="mb-0">
                        <i class="fas fa-pen text-primary"></i>
                        <span th:if="${existingReport == null}">Write Daily Report</span>
                        <span th:if="${existingReport != null}">Edit Daily Report</span>
                    </h4>
                </div>

                <!-- Warning if report exists for this date -->
                <div th:if="${existingReport != null}" class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    A report already exists for this date. You are editing the existing report.
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-file-alt"></i>
                            Daily Work Report –
                            <span th:if="${existingReport != null}"
                                  th:text="${#temporals.format(existingReport.reportDate, 'EEEE, MMMM dd, yyyy')}">Date</span>
                            <span th:if="${existingReport == null}"
                                  th:text="${#temporals.format(reportDate, 'EEEE, MMMM dd, yyyy')}">Date</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${existingReport != null} ? '/employee/daily-reports/update/' + ${existingReport.id} : '/employee/daily-reports/save'"
                              method="post">
                            <input type="hidden" name="reportDate"
                                   th:value="${existingReport != null} ? ${existingReport.reportDate} : ${reportDate}">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="section-label"><i class="fas fa-tasks"></i> Work Summary</label>
                                    <textarea name="workSummary" class="form-control" rows="3"
                                              placeholder="Describe the overall work done today..."
                                              th:text="${existingReport?.workSummary}"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="section-label"><i class="fas fa-check-circle text-success"></i> Tasks Completed</label>
                                    <textarea name="tasksCompleted" class="form-control" rows="4"
                                              placeholder="List tasks you completed today (one per line)..."
                                              th:text="${existingReport?.tasksCompleted}"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="section-label"><i class="fas fa-spinner text-warning"></i> Tasks In Progress</label>
                                    <textarea name="tasksInProgress" class="form-control" rows="4"
                                              placeholder="List ongoing tasks..."
                                              th:text="${existingReport?.tasksInProgress}"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="section-label"><i class="fas fa-exclamation-triangle text-danger"></i> Challenges / Blockers</label>
                                    <textarea name="challenges" class="form-control" rows="3"
                                              placeholder="Any challenges or blockers faced..."
                                              th:text="${existingReport?.challenges}"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="section-label"><i class="fas fa-calendar-day text-info"></i> Plans for Next Day</label>
                                    <textarea name="plansForNextDay" class="form-control" rows="3"
                                              placeholder="What you plan to work on tomorrow..."
                                              th:text="${existingReport?.plansForNextDay}"></textarea>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Status</label>
                                    <select name="status" class="form-select">
                                        <option value="DRAFT"
                                                th:selected="${existingReport != null and existingReport.status == 'DRAFT'}">
                                            Draft
                                        </option>
                                        <option value="SUBMITTED"
                                                th:selected="${existingReport == null or existingReport.status == 'SUBMITTED'}">
                                            Submitted
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary me-2">
                                        <i class="fas fa-save"></i>
                                        <span th:if="${existingReport != null}">Update Report</span>
                                        <span th:if="${existingReport == null}">Save Report</span>
                                    </button>
                                    <a href="/employee/daily-reports" class="btn btn-outline-secondary">
                                        <i class="fas fa-times"></i> Cancel
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
