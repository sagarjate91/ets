<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - ETS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }

        body {
            background-color: #ecf0f1;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .sidebar {
            background: var(--primary-color);
            min-height: 100vh;
        }

        .sidebar a {
            color: #ecf0f1;
            padding: 0.75rem 1.5rem;
            display: block;
        }

        .sidebar a:hover {
            background-color: var(--secondary-color);
        }

        .main-content {
            padding: 2rem;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .table {
            background: white;
        }

        .badge {
            padding: 0.5rem 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-users"></i> ETS Admin</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li><a href="/admin/dashboard"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/admin/employees"><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="/admin/users"><i class="fas fa-user-tie"></i> Users</a></li>
                </ul>
            </nav>

            <main class="col-md-10 main-content">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-tie"></i> User Management</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${users.isEmpty()}" class="alert alert-info">
                            No users found
                        </div>
                        <div th:if="${not users.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Name</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.username}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                                        <td>
                                            <span th:if="${user.role == 'ADMIN'}" class="badge bg-danger">Admin</span>
                                            <span th:if="${user.role == 'EMPLOYEE'}" class="badge bg-primary">Employee</span>
                                        </td>
                                        <td>
                                            <span th:if="${user.enabled}" class="badge bg-success">Enabled</span>
                                            <span th:if="${not user.enabled}" class="badge bg-secondary">Disabled</span>
                                        </td>
                                        <td>
                                            <form th:if="${user.enabled}" th:action="@{/admin/users/disable/{id}(id=${user.id})}" method="GET" style="display:inline;">
                                                <button type="submit" class="btn btn-warning btn-sm">
                                                    <i class="fas fa-lock"></i> Disable
                                                </button>
                                            </form>
                                            <form th:if="${not user.enabled}" th:action="@{/admin/users/enable/{id}(id=${user.id})}" method="GET" style="display:inline;">
                                                <button type="submit" class="btn btn-success btn-sm">
                                                    <i class="fas fa-unlock"></i> Enable
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
